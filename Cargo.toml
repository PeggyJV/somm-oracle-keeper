[package]
name = "somm-oracle-keeper"
version = "0.1.0"
edition = "2021"
description = "Keeper for Sommelier ERC4626SharePriceOracleKeeper contracts. Calls performUpkeep on an hourly cadence through a threshold-1 Gnosis Safe, signing with a GCP KMS key."

[dependencies]
alloy = { version = "2.4", features = ["full", "signer-gcp", "signer-local"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
opt-level = 2
